<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reloj mundial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff3;--ink:#12161c;--mute:#566070;--line:#cfd5de;--btn:#12161c;--btnink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13161b;--ink:#eef1f5;--mute:#9aa4b3;--line:#2b313b;--btn:#eef1f5;--btnink:#13161b}}
:root[data-theme="dark"]{--bg:#13161b;--ink:#eef1f5;--mute:#9aa4b3;--line:#2b313b;--btn:#eef1f5;--btnink:#13161b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:1100px;margin:0 auto;padding:28px 18px 48px}
header{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:8px}
h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;letter-spacing:-.03em;line-height:1;margin:0}
.me{color:var(--mute);font-size:.95rem;margin:8px 0 0;font-variant-numeric:tabular-nums}
button{font:inherit;font-weight:600;background:var(--btn);color:var(--btnink);border:0;border-radius:999px;padding:10px 18px;cursor:pointer}
button:focus-visible{outline:3px solid #3b82f6;outline-offset:3px}
section{margin-top:34px}
h2{font-size:1.25rem;font-weight:600;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:baseline}
h2 small{color:var(--mute);font-weight:400;font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{border-radius:18px;padding:16px 16px 14px;min-height:178px;display:flex;flex-direction:column;justify-content:space-between;transition:background-color 1s,color 1s}
.city{font-weight:600;font-size:1.05rem;line-height:1.2}
.zone{font-size:.8rem;opacity:.78;margin-top:2px}
.time{font-size:clamp(2.3rem,9vw,2.9rem);font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;margin:12px 0 10px}
.time .s{font-size:.45em;font-weight:600;letter-spacing:0;opacity:.7;margin-left:2px}
.time .ap{font-size:.34em;font-weight:600;letter-spacing:0;margin-left:5px}
.meta{font-size:.82rem;line-height:1.35;font-variant-numeric:tabular-nums}
.meta span{display:block;opacity:.8}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.tile{padding:13px 13px 12px;min-height:168px}}
</style>
</head>
<body>
<main>
<header>
<div>
<h1>Reloj mundial</h1>
<p class="me" id="me"></p>
</div>
<button id="fmt" type="button" aria-pressed="true">Formato de 24 horas</button>
</header>
<div id="root"></div>
</main>
<script>
var GROUPS=[
{n:"Honduras",z:[["Tegucigalpa","America/Tegucigalpa","Hora central, sin horario de verano"]]},
{n:"Japón",z:[["Tokio","Asia/Tokyo","Hora estándar de Japón"]]},
{n:"China",z:[["Pekín y Shanghái","Asia/Shanghai","Hora estándar de China"]]},
{n:"Corea del Sur",z:[["Seúl","Asia/Seoul","Hora estándar de Corea"]]},
{n:"Estados Unidos",z:[
["Nueva York","America/New_York","Este (ET)"],
["Chicago","America/Chicago","Centro (CT)"],
["Denver","America/Denver","Montaña (MT)"],
["Phoenix","America/Phoenix","Arizona, sin horario de verano"],
["Los Ángeles","America/Los_Angeles","Pacífico (PT)"],
["Anchorage","America/Anchorage","Alaska (AKT)"],
["Honolulu","Pacific/Honolulu","Hawái (HST)"],
["San Juan","America/Puerto_Rico","Atlántico, Puerto Rico"],
["Pago Pago","Pacific/Pago_Pago","Samoa Americana"],
["Hagåtña","Pacific/Guam","Chamorro, Guam"]]},
{n:"España",z:[
["Madrid","Europe/Madrid","Península y Baleares"],
["Las Palmas","Atlantic/Canary","Islas Canarias"]]},
{n:"Australia",z:[
["Sídney","Australia/Sydney","Este: Sídney, Melbourne, Canberra, Hobart"],
["Brisbane","Australia/Brisbane","Queensland, sin horario de verano"],
["Adelaida","Australia/Adelaide","Centro-sur"],
["Darwin","Australia/Darwin","Territorio del Norte"],
["Perth","Australia/Perth","Oeste"]]}
];
var h24=true, tiles=[], root=document.getElementById("root");
var pad=function(n){return String(n).padStart(2,"0")};
GROUPS.forEach(function(g){
  var sec=document.createElement("section");
  var h=document.createElement("h2");
  h.innerHTML=g.n+(g.z.length>1?"<small>"+g.z.length+" zonas horarias</small>":"");
  var grid=document.createElement("div");grid.className="grid";
  g.z.forEach(function(z){
    var el=document.createElement("div");el.className="tile";
    el.innerHTML='<div><div class="city"></div><div class="zone"></div></div><div class="time"></div><div class="meta"><span class="d"></span><span class="o"></span></div>';
    el.querySelector(".city").textContent=z[0];
    el.querySelector(".zone").textContent=z[2];
    grid.appendChild(el);
    tiles.push({el:el,tz:z[1],
      f:new Intl.DateTimeFormat("es",{timeZone:z[1],hourCycle:"h23",year:"numeric",month:"short",day:"numeric",weekday:"short",hour:"numeric",minute:"numeric",second:"numeric"}),
      t:el.querySelector(".time"),d:el.querySelector(".d"),o:el.querySelector(".o")});
  });
  sec.appendChild(h);sec.appendChild(grid);root.appendChild(sec);
});
function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}
function sm(a,b,x){var t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)}
function sky(hr){
  var s=Math.sin(Math.PI*(hr-6)/12);
  var c=mix([22,28,62],[142,196,236],sm(-.15,.35,s));
  var w=Math.exp(-Math.pow(s/.2,2))*.75;
  c=mix(c,[238,148,98],w);
  var lum=.299*c[0]+.587*c[1]+.114*c[2];
  return {bg:"rgb("+c.map(Math.round).join(",")+")",fg:lum<135?"#f4f6fb":"#0f1722"};
}
function gmt(m){var a=Math.abs(m),h=Math.floor(a/60),mm=a%60;return "GMT"+(m<0?"−":"+")+h+(mm?":"+pad(mm):"")}
function tick(){
  var now=new Date(),sec=Math.floor(now.getTime()/1000)*1000;
  var devOff=-now.getTimezoneOffset();
  var devDay=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
  tiles.forEach(function(t){
    var p={};t.f.formatToParts(now).forEach(function(x){p[x.type]=x.value});
    var Y=+p.year,H=+p.hour,Mi=+p.minute,S=+p.second;
    var months={ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,set:8,oct:9,nov:10,dic:11};
    var mo=months[p.month.replace(".","").toLowerCase()];
    var off=Math.round((Date.UTC(Y,mo,+p.day,H,Mi,S)-sec)/60000);
    var hh=H,ap="";
    if(!h24){ap=H<12?"a. m.":"p. m.";hh=H%12||12}
    t.t.innerHTML=(h24?pad(hh):hh)+":"+pad(Mi)+'<span class="s">:'+pad(S)+'</span>'+(ap?'<span class="ap">'+ap+'</span>':"");
    var dd=Math.round((Date.UTC(Y,mo,+p.day)-devDay)/864e5);
    var rel=dd===0?"hoy":dd===1?"mañana":dd===-1?"ayer":"";
    t.d.textContent=p.weekday.replace(".","")+" "+p.day+" "+p.month.replace(".","")+(rel?", "+rel:"");
    var diff=off-devOff,a=Math.abs(diff);
    t.o.textContent=gmt(off)+(diff===0?", igual que tú":", "+(diff>0?"+":"−")+Math.floor(a/60)+" h"+(a%60?" "+a%60+" min":"")+" frente a ti");
    var c=sky(H+Mi/60);
    t.el.style.backgroundColor=c.bg;t.el.style.color=c.fg;
  });
  var mf=new Intl.DateTimeFormat("es",{hourCycle:h24?"h23":"h12",hour:"2-digit",minute:"2-digit",second:"2-digit"});
  var zn="";try{zn=Intl.DateTimeFormat().resolvedOptions().timeZone.replace(/_/g," ")}catch(e){}
  document.getElementById("me").textContent="Tu hora: "+mf.format(now)+(zn?" en "+zn:"");
}
var btn=document.getElementById("fmt");
btn.addEventListener("click",function(){
  h24=!h24;btn.setAttribute("aria-pressed",String(h24));
  btn.textContent=h24?"Formato de 24 horas":"Formato de 12 horas";tick();
});
tick();setInterval(tick,1000);
</script>
</body>
</html>
